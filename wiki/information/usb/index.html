<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="https://github.com/user-attachments/assets/134de4f5-9a3c-434c-9926-755a2d930e1d" />

<title>Pixalator Wiki | USB</title>
</head>
<body>
  <div class="header"></div>
    <div style="display: flex; align-items: right; margin-left: auto; margin-right: 20px;">
      <button onclick="window.open('https://modrinth.com/mod/pixelator')">Mod Page</button>
      <div class="dropdown">
        <button class="dropbtn">Pages</button>
        <div class="dropdown-content">
          <button onclick="document.location='../wiki.html'">Home</button>
          <button onclick="document.location='../information.html'">Information</button>
          <button onclick="document.location='../changelog.html'">Changelog</button>
        </div>
      </div>
      <button onclick="window.open('https://github.com/firemarios/Pixelator/issues')">Issues</button>
    </div>
  </div>
  <div id="three-column-layout" class="columns" style="display: flex; position: fixed; margin-top: 0px; left: 0; right: 0; bottom: 0; overflow-y: auto; height: auto;">
  <div id="sidebar-column" style="width: 20%; background-color: rgb(25, 100, 25); display: flex; flex-direction: column; overflow-y: visible; padding: 10px; height: auto; overflow-x: hidden;">
    <div style="width: 100%; padding: 20px 10px 10px 10px; box-sizing: border-box; color: white; flex-grow: 1; overflow-y: auto;">
        <h2 style="text-align: center; font-family: minecraft-pixelator; letter-spacing: 1px; text-shadow: 2px 2px 0px black, 3px 3px 0px black, 4px 4px 0px black, 5px 5px 0px black; margin-top: 0px;">Page Content</h2>
        <a id="toc-list" style="padding-left: 20px;"></a>
      </div>
    </div>
    <div id="toc-column" style="width: 55%; background-color: transparent; margin-left: 0; padding-left: 20px; overflow-y: visible; height: fit-content; box-sizing: border-box; margin-top: -6px;">
        <h1>USB</h1>
        <hr>
        <p>The USB can store data for blocks like the <a href="javascript:goTo('information/server')">server</a>.</p>
        <h1>Changelog</h1>
        <hr>
        <h4>Version 1.3.0</h4>
        <p>Added new item: USB</p>
    </div>
    <div class="info-column" style="width: 24%; background-color: transparent; margin-top: -6px; padding-left: 10px; padding-right: 10px;">
        <div class="general-box" style="justify-content: center; align-items: center; text-align: center;">
            <h2>3D Item</h2>
            <img src="/Pixelator/wiki/assets/usb.png" style="width: 200px; margin-top: -10px; margin-bottom: 20px;">
        </div>
        <div class="general-box" style="justify-content: center; align-items: center; text-align: center;">
            <h2>Crafting</h2>
          <div class="crafting-ui" style="width: 100%; margin-top: -25px;">
            <!-- Crafting Grid -->
            <div class="crafting-grid">
                <div class="slot">
                </div>
                <div class="slot">
                <img src="/Pixelator/wiki/assets/crafting/iron_ingot.png">
                <div class="tooltip">Iron Ingot</div>
                </div>
                <div class="slot">
                </div>
                <div class="slot">
                </div>
                <div class="slot">
                <img src="/Pixelator/wiki/assets/crafting/redstone_dust.png">
                <div class="tooltip">Redstone Dust</div>
                </div>
                <div class="slot">
                </div>
                <div class="slot">
                </div>
                <div class="slot">
                <img src="/Pixelator/wiki/assets/crafting/red_wool.png">
                <div class="tooltip">Red Wool</div>
                </div>
                <div class="slot">
                </div>
            </div>

            <!-- Result Slot -->
            <div class="slot result-slot" style="width: 72px; height: 72px;">
                <img src="/Pixelator/wiki/assets/usb.png">
                <div class="tooltip">USB</div>
            </div>
            </div>
        </div>
    </div>


<script src="../../code/localUtils.js" type="module"></script></body>
</html>
